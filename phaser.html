<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phaser crowd</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        font: 13px system-ui;
        background: #2a2d33;
        color: #ddd;
      }
      form {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 8px 16px;
      }
      a {
        color: #9cf;
      }
      #game {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <form id="controls">
      <a href="/">← 3D viewer</a>
      <a href="/preview.html">Crowd preview</a>
      <label>Seed <input id="seed" type="number" value="1" style="width: 90px" /></label>
      <button id="reseed" type="button">Reseed</button>
      <label>
        Crowd
        <input id="count" type="range" min="50" max="2000" step="50" />
        <output id="count-label" style="font-variant-numeric: tabular-nums"></output>
      </label>
      <span id="status"></span>
      <span id="fps" style="font-variant-numeric: tabular-nums"></span>
    </form>
    <div id="game"></div>
    <script type="module" src="/src/phaser/main.ts"></script>
  </body>
</html>
